<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Space</title>
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        body {
            background-color: #120118;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* Kept to top so layout flows naturally */
            position: relative;
            overflow-y: auto; /* Allows scrolling if needed */
            overflow-x: hidden;
        }
        
        #heartsCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        
        header, .main-container, footer {
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 20px;
            background: #1c1124;
            width: 100%;
        }
        header h1 {
            font-size: 2rem;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            flex-grow: 1;
            padding: 20px;
            width: 100%;
        }

        .hero {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 25px;
        }
        .hero img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            margin-bottom: 15px;
        }
        .hero h2 {
            margin-bottom: 5px;
            font-size: 1.8rem;
        }
        .hero p {
            color: #ccc;
            font-size: 1rem;
            line-height: 1.4;
        }

        /* --- PLAYLIST JUKEBOX WIDGET --- */
        .music-widget {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            background: rgba(42, 19, 55, 0.7);
            border: 1px solid #461e5d;
            padding: 12px 25px;
            border-radius: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 340px;
            transition: 0.3s ease;
        }
        .music-widget:hover {
            border-color: #ff4d8d;
            background: rgba(42, 19, 55, 0.9);
        }
        .music-clickable-area {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            flex-grow: 1;
        }
        .music-icon {
            font-size: 1.4rem;
            display: inline-block;
            animation: spinDisc 3s linear infinite;
            animation-play-state: paused;
        }
        .music-widget.playing .music-icon {
            animation-play-state: running;
        }
        .music-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }
        .music-label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #fff;
        }
        .song-title {
            font-size: 0.75rem;
            color: #ff4da6;
            margin-top: 2px;
            font-style: italic;
        }
        .next-song-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px;
            transition: 0.2s;
        }
        .next-song-btn:hover {
            color: #ff4d8d;
            transform: scale(1.1);
        }
        @keyframes spinDisc {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- FIXED PASSWORD BOX CONTAINER --- */
        .secret-box {
            background-color: #1f0e2c;
            padding: 25px;
            border-radius: 12px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 80px; /* Force deep spacing below the password section */
        }
        
        input[type="password"] {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            margin-bottom: 20px; /* Clean gap before the enter button */
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 1rem;
            background: white;
            color: black;
            text-align: center;
            display: block;
        }
        
        #enterBtn {
            width: 100%;
            background-color: #ff4d8d;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: block;
        }
        #enterBtn:hover {
            background-color: #e0358d;
        }
        
        /* --- EXTRA FOOTER PADDING FOR SCREEN ROOM --- */
        footer {
            text-align: center;
            padding: 40px 20px 80px 20px; /* Deep bottom padding to create blank space */
            font-size: 0.9rem;
            color: #888;
            font-style: italic;
            width: 100%;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <canvas id="heartsCanvas"></canvas>

    <header>
        <h1>𝐕🤍𝐑</h1>
    </header>

    <div class="main-container">
        <div class="hero">
            <img src="https://i.ibb.co/x8mH6Vj8/Screenshot-20260525-225554.jpg" />
            <h2>𝓜𝓮 𝓥 𝓪𝓷𝓭 𝓜𝔂 𝐐𝓾𝓮௥ 𝓡 💕</h2>
            <p>Welcome to our private website.<br>For my Love, Who is close to my heart to my wife, My pondaati ❤️</p>
        </div>

        <div class="music-widget" id="musicControl">
            <div class="music-clickable-area" onclick="toggleMusicWidget()">
                <span class="music-icon" id="discIcon">🎵</span>
                <div class="music-info">
                    <span class="music-label" id="musicStatus">Tap to Play Music 🎧</span>
                    <span class="song-title" id="currentTrackName">Song 1</span>
                </div>
            </div>
            <button class="next-song-btn" onclick="nextSong()" title="Next Song">⏭️</button>
        </div>

        <div class="secret-box">
            <h3><strong>Private area👀</strong></h3>
            <p style="font-style: italic; color: #aaa; margin-bottom: 15px; font-size: 0.9rem;">"Welcome to our dream Romantic and fantasy World."</p>
            <input type="password" id="password" placeholder="Enter Password">
            <button id="enterBtn" onclick="checkPassword()">Enter Room</button>
        </div>
    </div>

    <audio id="bgMusic" loop preload="auto" crossorigin="anonymous"></audio>

    <footer>
        Made for us our secret thing. For my Queen and Me..... 🖤
    </footer>

<script>
const music = document.getElementById("bgMusic");
const widget = document.getElementById("musicControl");
const label = document.getElementById("musicStatus");
const trackNameDisplay = document.getElementById("currentTrackName");

const playlist = [
    {
        title: "Aradhiya. kushi💖",
        url: "https://files.catbox.moe/w3v3hb.mp3"
    },
    {
        title: "Innum konjam neram🖤",

    },
    {
        title: "Kannadi poove👀",
        url: "https://files.catbox.moe/kfv1no.mp3"
    },
    {
        title: "Naan aval illai💌",
        url: "https://files.catbox.moe/n32y87.mp3"
    },
    {
        title: "Nallaru Po.....🥺",
        url: "https://files.catbox.moe/4qaj0i.mp3"
    },
    {
        title: "Neethanae.....Neethanae....🩷",
        url: "https://files.catbox.moe/8qrykc.mp3"
    },
    {
        title: "Neeyum naanum anbe💗",
        url: "https://files.catbox.moe/fth0q7.mp3"
    },
    {
        title: "oh penne💘",
        url: "https://files.catbox.moe/j8nlue.mp3"
    },
    {
        title: "Oxygen🤍",
        url: "https://files.catbox.moe/u140jk.mp3"
    },
    {
        title: "Velica poove....❤️‍🩹",
        url: "https://files.catbox.moe/4r721k.mp3"
    },
    {
        title: "venmathiyae..🥺",
        url: "https://files.catbox.moe/kq5s3n.mp3"
    },
    {
        title: "Yendi vittu pona..🥺💔",
        url: "https://files.catbox.moe/9rthr7.mp3"
    }
];

let currentTrackIndex = 0;

function loadTrack(index) {
    music.src = playlist[index].url;
    trackNameDisplay.innerText = playlist[index].title;
}
loadTrack(currentTrackIndex);

function toggleMusicWidget() {
    if (music.paused) {
        music.play().then(() => {
            widget.classList.add("playing");
            label.innerText = "Playing Music 💖";
        }).catch(err => { 
            label.innerText = "Error: Tap again 🎧"; 
            console.error(err);
        });
    } else {
        music.pause();
        widget.classList.remove("playing");
        label.innerText = "Music: Paused ⏸️";
    }
}

function nextSong() {
    currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
    const wasPlaying = !music.paused;
    loadTrack(currentTrackIndex);
    
    if (wasPlaying) {
        music.play().then(() => {
            widget.classList.add("playing");
            label.innerText = "Playing Music 💖";
        });
    }
}

function checkPassword(){
    const password = document.getElementById("password").value;
    if(password === "visha27112011"){
        window.location.href = "chat.html";
    } else {
        alert("Wrong Password");
    }
}

document.getElementById("password").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        checkPassword();
    }
});

const canvas = document.getElementById("heartsCanvas");
const ctx = canvas.getContext("2d");
let totalHearts = 25;
let heartsArray = [];

function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

class FloatingHeart {
    constructor() { this.reset(); this.y = Math.random() * canvas.height; }
    reset() {
        this.x = Math.random() * canvas.width; this.y = canvas.height + 20;
        this.size = Math.random() * 8 + 5; this.speedY = Math.random() * 0.6 + 0.3;
        this.opacity = Math.random() * 0.4 + 0.1; this.hue = [330, 300, 280][Math.floor(Math.random() * 3)];
    }
    update() { this.y -= this.speedY; if (this.y < -20) this.reset(); }
    draw() {
        ctx.save(); ctx.globalAlpha = this.opacity; ctx.fillStyle = `hsl(${this.hue}, 100%, 65%)`;
        ctx.beginPath(); ctx.moveTo(this.x, this.y);
        ctx.bezierCurveTo(this.x - this.size/2, this.y - this.size/2, this.x - this.size, this.y + this.size/3, this.x, this.y + this.size * 0.9);
        ctx.bezierCurveTo(this.x + this.size, this.y + this.size/3, this.x + this.size/2, this.y - this.size/2, this.x, this.y);
        ctx.fill(); ctx.restore();
    }
}
function initHearts() { for (let i = 0; i < totalHearts; i++) heartsArray.push(new FloatingHeart()); }
function animateHearts() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < heartsArray.length; i++) { heartsArray[i].update(); heartsArray[i].draw(); }
    requestAnimationFrame(animateHearts);
}
initHearts(); animateHearts();
</script>
</body>
</html>
