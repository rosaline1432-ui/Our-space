<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Space</title>
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        body {
            background-color: #120118;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        
        /* --- FLOATING HEARTS BACKGROUND CANVAS --- */
        #heartsCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        
        header, .main-container, footer {
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 20px;
            background: #1c1124;
        }
        header h1 {
            font-size: 2rem;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            padding: 20px;
        }

        .hero {
            text-align: center;
            margin-bottom: 25px;
        }
        .hero img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            margin-bottom: 15px;
        }
        .hero h2 {
            margin-bottom: 5px;
            font-size: 1.8rem;
        }
        .hero p {
            color: #ccc;
            font-size: 1rem;
            line-height: 1.4;
        }

        /* --- AUDIO CONTROLLER WIDGET --- */
        .music-widget {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(42, 19, 55, 0.6);
            border: 1px solid #461e5d;
            padding: 10px 20px;
            border-radius: 30px;
            margin-bottom: 25px;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .music-widget:hover {
            background: rgba(42, 19, 55, 0.9);
            border-color: #ff4d8d;
            transform: scale(1.02);
        }
        .music-icon {
            font-size: 1.2rem;
            display: inline-block;
            animation: spinDisc 3s linear infinite;
            animation-play-state: paused;
        }
        .music-widget.playing .music-icon {
            animation-play-state: running;
        }
        .music-label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #fff;
        }
        @keyframes spinDisc {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .secret-box {
            background-color: #1f0e2c;
            padding: 25px;
            border-radius: 12px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        input[type="password"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 1rem;
            background: white;
            color: black;
            text-align: center;
        }
        button {
            width: 100%;
            background-color: #ff4d8d;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color: #e0358d;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <canvas id="heartsCanvas"></canvas>

    <header>
        <h1>𝐕🤍𝐑</h1>
    </header>

    <div class="main-container">
        <div class="hero">
            <img src="https://i.ibb.co/x8mH6Vj8/Screenshot-20260525-225554.jpg" />
            <h2>𝓜𝓮 𝓥 𝓪𝓷𝓭 𝓜𝔂 𝐐𝓾𝓮𝓮𝓷 𝓡 💕</h2>
            <p>Welcome to our private website.<br>For my Love, Who is close to my heart to my wife, My pondaati ❤️</p>
        </div>

        <div class="music-widget" id="musicControl" onclick="toggleMusicWidget()">
            <span class="music-icon">🎵</span>
            <span class="music-label" id="musicStatus">Tap to Play Music 🎧</span>
        </div>

        <div class="secret-box">
            <h3><strong>ℙ𝕣𝕚𝕧𝕒𝕥𝕖 𝕒𝕣𝕖𝕒👀</strong></h3>
            <p style="font-style: italic; color: #aaa; margin-bottom: 15px; font-size: 0.9rem;">"Welcome to our dream Romantic and fantasy World."</p>
            <input type="password" id="password" placeholder="Enter Password" id="passInput">
            <button id="enterBtn" onclick="checkPassword()">Enter Room</button>
        </div>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="https://files.catbox.moe/ryip47.mp3" type="audio/mpeg">
    </audio>

    <footer>
        Made for us our secret thing. For my Queen and Me..... 🖤
    </footer>

<script>
const music = document.getElementById("bgMusic");
const widget = document.getElementById("musicControl");
const label = document.getElementById("musicStatus");

function toggleMusicWidget() {
    if (music.paused) {
        music.play().then(() => {
            widget.classList.add("playing");
            label.innerText = "Playing Music 💖";
        }).catch(err => { label.innerText = "Error: Tap again 🎧"; });
    } else {
        music.pause();
        widget.classList.remove("playing");
        label.innerText = "Music: Paused ⏸️";
    }
}

function checkPassword(){
    const password = document.getElementById("password").value;
    if(password === "visha27112011"){
        // Redirects smoothly to our brand new chat room page file!
        window.location.href = "chat.html";
    } else {
        alert("Wrong Password");
    }
}

// Add enter key support for password field
document.getElementById("password").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        checkPassword();
    }
});

// --- FLOATING HEARTS ANIMATION ---
const canvas = document.getElementById("heartsCanvas");
const ctx = canvas.getContext("2d");
let totalHearts = 25;
let heartsArray = [];

function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

class FloatingHeart {
    constructor() { this.reset(); this.y = Math.random() * canvas.height; }
    reset() {
        this.x = Math.random() * canvas.width; this.y = canvas.height + 20;
        this.size = Math.random() * 8 + 5; this.speedY = Math.random() * 0.6 + 0.3;
        this.opacity = Math.random() * 0.4 + 0.1; this.hue = [330, 300, 280][Math.floor(Math.random() * 3)];
    }
    update() { this.y -= this.speedY; if (this.y < -20) this.reset(); }
    draw() {
        ctx.save(); ctx.globalAlpha = this.opacity; ctx.fillStyle = `hsl(${this.hue}, 100%, 65%)`;
        ctx.beginPath(); ctx.moveTo(this.x, this.y);
        ctx.bezierCurveTo(this.x - this.size/2, this.y - this.size/2, this.x - this.size, this.y + this.size/3, this.x, this.y + this.size * 0.9);
        ctx.bezierCurveTo(this.x + this.size, this.y + this.size/3, this.x + this.size/2, this.y - this.size/2, this.x, this.y);
        ctx.fill(); ctx.restore();
    }
}
function initHearts() { for (let i = 0; i < totalHearts; i++) heartsArray.push(new FloatingHeart()); }
function animateHearts() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < heartsArray.length; i++) { heartsArray[i].update(); heartsArray[i].draw(); }
    requestAnimationFrame(animateHearts);
}
initHearts(); animateHearts();
</script>
</body>
</html>
