<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        body {
            background-color: #0f1013; /* Solid Sleek Premium Dark */
            color: #e5e5e7;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- CLEAN HEADER --- */
        header {
            background: #16171b;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222327;
            flex-shrink: 0;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn {
            background: none;
            border: none;
            color: #007aff;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .header-profile-img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
        }
        .header-titles h2 {
            font-size: 0.95rem;
            color: #fff;
            font-weight: 600;
        }
        .status-text {
            font-size: 0.75rem;
            color: #8e8e93;
            display: block;
            margin-top: 2px;
        }
        .role-badge-select {
            background: #222327;
            border: 1px solid #2c2d31;
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            outline: none;
        }

        /* --- SUBTLE MUSIC OVERLAY --- */
        .widgets-deck {
            background: #16171b;
            padding: 6px 16px;
            display: flex;
            justify-content: flex-end;
            border-bottom: 1px solid #222327;
        }
        .music-mini-control {
            font-size: 0.72rem;
            color: #8e8e93;
            cursor: pointer;
            background: #222327;
            padding: 4px 10px;
            border-radius: 6px;
        }

        /* --- CHAT VIEWPORT --- */
        .chat-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #0f1013;
        }
        .messages-display {
            flex-grow: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* --- DATE SEPARATOR --- */
        .date-separator {
            display: flex;
            justify-content: center;
            margin: 12px 0;
        }
        .date-badge {
            color: #8e8e93;
            font-size: 0.72rem;
            font-weight: 500;
        }

        /* --- CHAT BUBBLES --- */
        .chat-row { display: flex; width: 100%; }
        .chat-row.sent { justify-content: flex-end; }
        .chat-row.received { justify-content: flex-start; }
        
        .chat-bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.92rem;
            line-height: 1.4;
            position: relative;
        }
        .chat-row.sent .chat-bubble {
            background-color: #007aff; /* Clean iOS Blue */
            color: white;
        }
        .chat-row.received .chat-bubble {
            background-color: #222327; /* Sophisticated Slate */
            color: white;
        }

        .bubble-media-preview {
            max-width: 100%;
            max-height: 240px;
            border-radius: 10px;
            margin-top: 4px;
            display: block;
            cursor: pointer;
        }
        
        .sender-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #8e8e93;
            margin-bottom: 2px;
            display: block;
        }
        .timestamp {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.5);
            float: right;
            margin-top: 6px;
            margin-left: 8px;
        }
        .bubble-heart-reaction {
            position: absolute;
            bottom: -6px;
            right: 12px;
            background: #16171b;
            border: 1px solid #2c2d31;
            font-size: 0.7rem;
            padding: 1px 4px;
            border-radius: 6px;
        }
        .chat-row.received .bubble-heart-reaction { left: 12px; right: auto; }

        /* --- TEXTING BAR & DOCK --- */
        .chat-input-area {
            background: #16171b;
            padding: 10px 14px 28px 14px; /* Premium spacing for mobile gesture bars */
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid #222327;
        }
        
        .attach-btn {
            background: #222327;
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .chat-input-area textarea {
            flex-grow: 1;
            background: #222327;
            border: 1px solid #2c2d31;
            border-radius: 20px;
            padding: 9px 15px;
            color: white;
            font-size: 0.95rem;
            resize: none;
            height: 38px;
            outline: none;
            font-family: inherit;
            line-height: 1.2;
        }
        
        .send-btn {
            background: #007aff;
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <button class="back-btn" onclick="window.location.href='index.html'">◀</button>
            <div class="header-titles">
                <h2 id="partnerDisplayTitle">Partner</h2>
                <span class="status-text" id="liveStatusTxt">online</span>
            </div>
        </div>
        <select class="role-badge-select" id="roleSelector" onchange="changeIdentityRole()">
            <option value="king">King</option>
            <option value="queen">Queen</option>
        </select>
    </header>

    <div class="widgets-deck">
        <div class="music-mini-control" id="musicBtn" onclick="toggleMusic()">🎵 Play Music</div>
    </div>

    <div class="chat-container">
        <div class="messages-display" id="notesSpace"></div>

        <div class="chat-input-area">
            <input type="file" id="mediaPicker" accept="image/*" style="display: none;" onchange="handleImageUpload(this)">
            <button class="attach-btn" onclick="document.getElementById('mediaPicker').click()">+</button>
            
            <textarea id="noteText" placeholder="Message" oninput="handleTyping()"></textarea>
            <button class="send-btn" id="postBtn" onclick="saveNote()">➔</button>
        </div>
    </div>

    <audio id="bgMusic" loop preload="auto" crossorigin="anonymous"></audio>

<script>
const SUPABASE_URL = "https://qawwahkvfibfvguboarm.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFhd3dhaGt2ZmliZnZndWJvYXJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTY2ODgsImV4cCI6MjA5NTM5MjY4OH0.qXy5KdAcW4AyIKR9eLWdXdLfhGFEKyDYaML9k0AFL2M";

const dbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let presenceChannel = null;
let myConfiguredName = "King";
let partnerConfiguredName = "Queen";
let isTypingState = false;
let typingTimeout = null;
let sessionToken = "user_" + Math.random().toString(36).substring(5);
let collectivePresence = {};

const audioTrack = document.getElementById("bgMusic");
audioTrack.src = "https://files.catbox.moe/w3v3hb.mp3";

function toggleMusic() {
    if (audioTrack.paused) {
        audioTrack.play();
        document.getElementById("musicBtn").innerText = "⏸️ Pause";
    } else {
        audioTrack.pause();
        document.getElementById("musicBtn").innerText = "🎵 Play Music";
    }
}

function loadIdentity() {
    let saved = localStorage.getItem("chat_user_role") || "king";
    document.getElementById("roleSelector").value = saved;
    myConfiguredName = saved === "queen" ? "Queen" : "King";
    partnerConfiguredName = saved === "queen" ? "King" : "Queen";
    document.getElementById("partnerDisplayTitle").innerText = partnerConfiguredName;
}

function changeIdentityRole() {
    localStorage.setItem("chat_user_role", document.getElementById("roleSelector").value);
    loadIdentity();
    setupPresence();
    loadNotes();
}

async function handleImageUpload(input) {
    if (!input.files || input.files.length === 0) return;
    const file = input.files[0];
    const btn = document.getElementById("postBtn");
    btn.disabled = true;

    const ext = file.name.split('.').pop();
    const uniquePath = `${Date.now()}_${Math.random().toString(36).substring(5)}.${ext}`;

    const { data, error } = await dbClient.storage.from('chat-media').upload(uniquePath, file);

    if (error) {
        alert("Make sure you created a public bucket named 'chat-media' in Supabase!");
        btn.disabled = false;
        return;
    }

    const { data: urlObj } = dbClient.storage.from('chat-media').getPublicUrl(uniquePath);
    await dbClient.from('messages').insert([{ author: myConfiguredName, text: urlObj.publicUrl }]);
    
    input.value = "";
    btn.disabled = false;
    loadNotes();
}

function handleTyping() {
    if (!isTypingState) {
        isTypingState = true;
        if (presenceChannel) presenceChannel.track({ name: myConfiguredName, typing: true });
    }
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => {
        isTypingState = false;
        if (presenceChannel) presenceChannel.track({ name: myConfiguredName, typing: false });
    }, 1500);
}

function updatePresenceUI() {
    const textEl = document.getElementById("liveStatusTxt");
    let online = false, typing = false;

    Object.keys(collectivePresence).forEach(token => {
        if (token !== sessionToken) {
            const state = collectivePresence[token];
            if (state && state[0] && state[0].name.toLowerCase() === partnerConfiguredName.toLowerCase()) {
                online = true;
                if (state[0].typing) typing = true;
            }
        }
    });

    if (typing) textEl.innerText = "typing...";
    else if (online) textEl.innerText = "online";
    else textEl.innerText = "offline";
}

function setupPresence() {
    if (presenceChannel) presenceChannel.unsubscribe();
    presenceChannel = dbClient.channel('presence-deck', { config: { presence: { key: sessionToken } } });
    presenceChannel
        .on('presence', { event: 'sync' }, () => {
            collectivePresence = presenceChannel.presenceState();
            updatePresenceUI();
        })
        .subscribe(async (status) => {
            if (status === 'SUBSCRIBED') await presenceChannel.track({ name: myConfiguredName, typing: false });
        });
}

async function loadNotes() {
    const space = document.getElementById("notesSpace");
    const { data, error } = await dbClient.from('messages').select('*').order('id', { ascending: true });
    if (error || !space) return;

    const scrollCheck = space.scrollHeight - space.scrollTop <= space.clientHeight + 150;
    space.innerHTML = "";
    let lastGroupDate = "";

    data.forEach(msg => {
        const dateObj = msg.created_at ? new Date(msg.created_at) : new Date();
        const groupDate = dateObj.toDateString();

        if (groupDate !== lastGroupDate) {
            space.innerHTML += `<div class="date-separator"><span class="date-badge">${dateObj.toLocaleDateString([], {month:'short', day:'numeric'})}</span></div>`;
            lastGroupDate = groupDate;
        }

        let msgAuthor = msg.author ? msg.author.trim() : "King";
        if (msgAuthor.toLowerCase() === "parker") {
            msgAuthor = "King";
        }

        const isMe = msgAuthor.toLowerCase() === myConfiguredName.toLowerCase();
        const side = isMe ? "sent" : "received";
        const timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
        const heart = msg.tags === "loved" ? `<span class="bubble-heart-reaction">❤️</span>` : '';

        let content = `<span>${msg.text}</span>`;
        if (msg.text.match(/\.(jpeg|jpg|gif|png)/i) || msg.text.includes("/storage/v1/object/public/")) {
            content = `<img class="bubble-media-preview" src="${msg.text}" onclick="window.open('${msg.text}', '_blank')" />`;
        }

        space.innerHTML += `
            <div class="chat-row ${side}">
                <div class="chat-bubble" id="msg-${msg.id}">
                    <span class="sender-label">${msgAuthor}</span>
                    ${content}
                    <span class="timestamp">${timeStr}</span>
                    ${heart}
                </div>
            </div>
        `;
    });

    data.forEach(msg => {
        const el = document.getElementById(`msg-${msg.id}`);
        if (!el) return;
        let tapped = 0;
        el.addEventListener('click', () => {
            let now = Date.now();
            if (now - tapped < 300) toggleHeart(msg.id, msg.tags);
            tapped = now;
        });

        let timer;
        el.addEventListener('touchstart', () => timer = setTimeout(() => deleteMsg(msg.id), 1000));
        el.addEventListener('touchend', () => clearTimeout(timer));
    });

    if (scrollCheck) space.scrollTop = space.scrollHeight;
}

async function toggleHeart(id, tag) {
    await dbClient.from('messages').update({ tags: tag === "loved" ? null : "loved" }).eq('id', id);
    loadNotes();
}

async function saveNote() {
    const input = document.getElementById("noteText");
    const txt = input.value.trim();
    if (!txt) return;
    input.value = "";
    await dbClient.from('messages').insert([{ author: myConfiguredName, text: txt }]);
    loadNotes();
}

async function deleteMsg(id) {
    if (confirm("Delete message?")) {
        await dbClient.from('messages').delete().eq('id', id);
        loadNotes();
    }
}

document.getElementById("noteText").addEventListener("keypress", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); saveNote(); } });

loadIdentity();
window.onload = () => {
    setupPresence();
    loadNotes();
    setInterval(loadNotes, 4000);
    setInterval(updatePresenceUI, 4000);
};
</script>
</body>
</html>
