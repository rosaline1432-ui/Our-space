<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Our Space 👑❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #0d080b;
            color: #f5f0f2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* --- SCREEN ANIMATION MANAGER --- */
        .app-screen {
            display: none;
            height: 100%;
            width: 100%;
            flex-direction: column;
            overflow: hidden;
        }
        .app-screen.active {
            display: flex;
        }

        /* --- SCREEN 0: PRIVATE PASSCODE LOCK --- */
        #lockScreen {
            justify-content: center;
            align-items: center;
            background: #0d080b;
            padding: 24px;
            text-align: center;
        }
        .lock-heart {
            font-size: 3.5rem;
            color: #ff4d79;
            margin-bottom: 20px;
            animation: pulseHeart 1.5s infinite alternate;
        }
        @keyframes pulseHeart { 0% { transform: scale(1); } 100% { transform: scale(1.15); } }
        
        .lock-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
            letter-spacing: 0.5px;
        }
        .lock-subtitle {
            font-size: 0.9rem;
            color: #b5a4ab;
            margin-bottom: 28px;
        }
        .password-input-container {
            position: relative;
            max-width: 280px;
            width: 100%;
            margin-bottom: 20px;
        }
        .password-input-container input {
            width: 100%;
            background: #1a1015;
            border: 2px solid #2e1c25;
            border-radius: 25px;
            padding: 14px 20px;
            color: white;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
            letter-spacing: 3px;
            transition: border-color 0.3s;
        }
        .password-input-container input:focus {
            border-color: #ff4d79;
        }
        .unlock-btn {
            background: linear-gradient(135deg, #ff4d79, #ff2a5f);
            color: white;
            border: none;
            padding: 14px 44px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 42, 95, 0.3);
            transition: transform 0.2s;
        }
        .unlock-btn:active { transform: scale(0.96); }
        .error-hint {
            color: #ff4d4d;
            font-size: 0.85rem;
            margin-top: 14px;
            display: none;
        }

        /* --- SCREEN 1: PORTAL HOMEPAGE --- */
        #homeScreen {
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, #160f14 0%, #0d080b 100%);
            padding: 30px;
            text-align: center;
        }
        .main-hero-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff4d79;
            box-shadow: 0 6px 25px rgba(255, 77, 121, 0.3);
            margin-bottom: 20px;
        }
        .main-welcome-title {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }
        .main-subtitle {
            font-size: 0.95rem;
            color: #ffb3c6;
            margin-bottom: 36px;
            letter-spacing: 0.5px;
        }
        .home-countdown-box {
            background: rgba(26, 16, 21, 0.6);
            border: 1px solid #2e1c25;
            padding: 18px 28px;
            border-radius: 24px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 44px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }
        .enter-space-btn {
            background: linear-gradient(135deg, #ff4d79, #ff2a5f);
            color: #fff;
            border: none;
            padding: 16px 48px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 42, 95, 0.4);
            transition: transform 0.2s;
        }
        .enter-space-btn:active { transform: scale(0.96); }

        /* --- SCREEN 2: LIVE CHAT AREA VIEWPORT --- */
        #chatScreen {
            background-color: #0d080b;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            transition: background 0.4s ease;
        }

        header {
            background: rgba(26, 16, 21, 0.85);
            backdrop-filter: blur(12px);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(46, 28, 37, 0.5);
            flex-shrink: 0;
            z-index: 10;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn {
            background: none;
            border: none;
            color: #ff4d79;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 4px;
        }
        .header-profile-img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ff4d79;
        }
        .header-titles h2 {
            font-size: 1.05rem;
            color: #fff;
            font-weight: 600;
            display: flex;
            align-items: center;
        }
        .status-container {
            display: flex;
            flex-direction: column;
        }
        .status-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #8e8e93;
            transition: background-color 0.3s;
        }
        .status-text {
            font-size: 0.8rem;
            color: #b5a4ab;
        }
        .last-seen-text {
            font-size: 0.7rem;
            color: #a38f99;
            margin-top: 1px;
        }
        .partner-mood-badge {
            font-size: 0.75rem;
            background: rgba(255, 77, 121, 0.2);
            color: #ff4d79;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 8px;
            font-weight: bold;
        }
        .status-container.online .status-dot { background-color: #00ff88; }
        .status-container.typing .status-dot {
            background-color: #ff4d79;
            animation: typingPulse 0.8s infinite alternate;
        }
        @keyframes typingPulse { 0% { opacity: 0.4; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .settings-gear-btn {
            background: none;
            border: none;
            color: #b5a4ab;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 4px;
            transition: color 0.2s;
        }
        .settings-gear-btn:hover { color: #ff4d79; }

        .role-badge-select {
            background: #2b1b23;
            border: 1px solid #4a303d;
            color: #ffb3c6;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            outline: none;
        }

        /* --- WIDGET CONTAINER DECK --- */
        .widgets-deck {
            background: rgba(20, 12, 16, 0.8);
            backdrop-filter: blur(12px);
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-bottom: 1px solid rgba(35, 21, 28, 0.5);
            flex-shrink: 0;
            z-index: 9;
        }
        .widgets-row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .countdown-widget {
            font-size: 0.85rem;
            color: #ffb3c6;
            font-weight: 600;
        }
        .playlist-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .current-track-name {
            font-size: 0.78rem;
            color: #ffb3c6;
            max-width: 120px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .music-mini-control {
            font-size: 0.78rem;
            color: #ff4d79;
            cursor: pointer;
            background: #25151e;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #3d2230;
            font-weight: 500;
        }

        /* --- MOOD BAR DECK --- */
        .mood-scroller-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 2px 0 4px 0;
            scrollbar-width: none;
        }
        .mood-scroller-bar::-webkit-scrollbar { display: none; }
        .mood-pill-item {
            background: #1d1219;
            border: 1px solid #361f2c;
            color: #f5f0f2;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 0.78rem;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mood-pill-item.active {
            background: linear-gradient(135deg, #ff4d79, #ff2a5f);
            border-color: #ff4d79;
            color: white;
            box-shadow: 0 2px 8px rgba(255, 77, 121, 0.3);
        }

        /* --- CHAT VIEWPORT MESSAGE CONSOLE --- */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            background: transparent;
        }
        .messages-display {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            -webkit-overflow-scrolling: touch;
            z-index: 2;
        }

        .date-separator {
            display: flex;
            justify-content: center;
            margin: 8px 0;
        }
        .date-badge {
            background-color: rgba(35, 21, 28, 0.85);
            color: #ffb3c6;
            font-size: 0.75rem;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid #3d2230;
            backdrop-filter: blur(4px);
        }

        .chat-row { display: flex; width: 100%; }
        .chat-row.sent { justify-content: flex-end; }
        .chat-row.received { justify-content: flex-start; }
        
        .chat-bubble {
            max-width: 78%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 0.98rem;
            line-height: 1.45;
            position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .chat-row.sent .chat-bubble {
            background: linear-gradient(135deg, #ff4d79, #ff2a5f);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .chat-row.received .chat-bubble {
            background: rgba(34, 22, 28, 0.9);
            color: #f5f0f2;
            border-bottom-left-radius: 4px;
            border: 1px solid #33202a;
            backdrop-filter: blur(6px);
        }

        .bubble-media-preview {
            max-width: 100%;
            max-height: 260px;
            border-radius: 14px;
            margin-top: 6px;
            display: block;
            cursor: pointer;
        }

        /* --- AUDIO PLAYER INSIDE BUBBLE --- */
        .chat-voice-player {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 2px;
            min-width: 180px;
        }
        .voice-play-control-btn {
            background: white;
            color: #ff2a5f;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
        .chat-row.received .voice-play-control-btn {
            background: #ff4d79;
            color: white;
        }
        .voice-timeline-bar {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            position: relative;
        }
        .chat-row.received .voice-timeline-bar {
            background: rgba(255, 77, 121, 0.2);
        }
        .voice-progress-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: white;
            border-radius: 2px;
        }
        .chat-row.received .voice-progress-fill {
            background: #ff4d79;
        }
        
        .sender-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #ffb3c6;
            margin-bottom: 4px;
            display: block;
        }
        .chat-row.sent .sender-label { color: #ffe5ec; }

        .timestamp {
            font-size: 0.68rem;
            color: rgba(255, 255, 255, 0.6);
            float: right;
            margin-top: 6px;
            margin-left: 10px;
        }
        .chat-row.received .timestamp { color: #a5949c; }

        .bubble-heart-reaction {
            position: absolute;
            bottom: -8px;
            right: 12px;
            background: #1a1015;
            border: 1px solid #ff4d79;
            font-size: 0.8rem;
            padding: 2px 6px;
            border-radius: 20px;
            animation: popHeart 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .chat-row.received .bubble-heart-reaction { left: 12px; right: auto; }
        @keyframes popHeart { 0% { transform: scale(0); } 100% { transform: scale(1); } }

        /* --- BALANCED INPUT CONSOLE DECK --- */
        .chat-input-area {
            background: rgba(22, 23, 27, 0.9);
            backdrop-filter: blur(12px);
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid rgba(34, 35, 39, 0.6);
            flex-shrink: 0;
            z-index: 10;
        }
        .attach-btn, .mic-record-action-btn {
            background: #2b1b23;
            border: 1px solid #4a303d;
            color: #ff4d79;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .mic-record-action-btn.recording {
            background: #ff2a5f;
            color: white;
            border-color: #ff4d79;
            animation: recordingPulse 1s infinite alternate;
        }
        @keyframes recordingPulse { 0% { transform: scale(1); box-shadow: 0 0 0 0px rgba(255, 42, 95, 0.5); } 100% { transform: scale(1.08); box-shadow: 0 0 0 8px rgba(255, 42, 95, 0); } }

        .chat-input-area textarea {
            flex: 1;
            background: #1f2024;
            border: 1px solid #2c2d31;
            border-radius: 22px;
            padding: 11px 16px;
            color: white;
            font-size: 1rem;
            resize: none;
            height: 42px;
            outline: none;
            line-height: 1.3;
        }
        .send-btn {
            background: linear-gradient(135deg, #ff4d79, #ff2a5f);
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* --- WALLPAPER ADJUSTMENT MODAL (UPDATED WITH GALLERY UPLOAD) --- */
        .wallpaper-panel-modal {
            display: none;
            position: absolute;
            top: 70px;
            right: 16px;
            background: #1a1015;
            border: 1px solid #3d2230;
            border-radius: 16px;
            padding: 16px;
            width: 260px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            z-index: 100;
        }
        .wallpaper-panel-modal.open { display: block; }
        .wallpaper-panel-modal h3 {
            font-size: 0.85rem;
            color: #ffb3c6;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .wallpaper-swatch-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }
        .swatch-item {
            height: 42px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            background-size: cover;
        }
        .swatch-item.selected { border-color: #ff4d79; }
        
        .gallery-wallpaper-btn {
            width: 100%;
            background: #2b1b23;
            border: 1px solid #4a303d;
            color: #ffb3c6;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
            transition: all 0.2s;
        }
        .gallery-wallpaper-btn:active {
            transform: scale(0.97);
            background: #3d2733;
        }
    </style>
</head>
<body>

    <div id="lockScreen" class="app-screen active">
        <div class="lock-heart">💖</div>
        <h2 class="lock-title">Our Private Space</h2>
        <p class="lock-subtitle">Enter the password to access</p>
        <div class="password-input-container">
            <input type="password" id="secretPasscodeField" placeholder="••••" autocomplete="off">
        </div>
        <button class="unlock-btn" onclick="checkSecretPassword()">Unlock ➔</button>
        <div class="error-hint" id="lockErrorMsg">Wrong password, try again matching layout 🥺</div>
    </div>

    <div id="homeScreen" class="app-screen">
        <img class="main-hero-avatar" src="https://i.ibb.co/x8mH6Vj8/Screenshot-20260525-225554.jpg" onerror="this.src='https://placehold.co/150x150/2b1b23/ff4d79?text=%E2%9D%A4%EF%B8%8F'">
        <h1 class="main-welcome-title">Our Space ❤️</h1>
        <p class="main-subtitle" id="portalSubText">Welcome Home</p>
        <div class="home-countdown-box" id="homeCounterDisplay">Counting days...</div>
        <button class="enter-space-btn" onclick="navigateTo('chatScreen')">Enter Chat Space ➔</button>
    </div>

    <div id="chatScreen" class="app-screen">
        <header>
            <div class="header-left">
                <button class="back-btn" onclick="navigateTo('homeScreen')">◀</button>
                <img class="header-profile-img" src="https://i.ibb.co/x8mH6Vj8/Screenshot-20260525-225554.jpg" onerror="this.src='https://placehold.co/100x100/2b1b23/ff4d79?text=%E2%9D%A4%EF%B8%8F'" />
                <div class="header-titles">
                    <h2><span id="partnerDisplayTitle">Partner</span><span id="partnerMoodDisplay" class="partner-mood-badge" style="display:none;">😊 Live</span></h2>
                    <div class="status-container offline" id="liveStatusBox">
                        <div class="status-row">
                            <div class="status-dot"></div>
                            <span class="status-text" id="liveStatusTxt">offline</span>
                        </div>
                        <span class="last-seen-text" id="lastSeenDisplay">checking...</span>
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <button class="settings-gear-btn" onclick="toggleWallpaperPanel()">⚙️</button>
                <select class="role-badge-select" id="roleSelector" onchange="changeIdentityRole()">
                    <option value="king">King 👑</option>
                    <option value="queen">Queen 👑</option>
                </select>
            </div>
        </header>

        <div class="wallpaper-panel-modal" id="wallpaperModal">
            <h3>Select Theme Background</h3>
            <div class="wallpaper-swatch-grid">
                <div class="swatch-item selected" style="background-color: #0d080b;" onclick="setWallpaper('preset-dark', this)"></div>
                <div class="swatch-item" style="background: linear-gradient(145deg, #150a21, #08030f);" onclick="setWallpaper('preset-purple', this)"></div>
                <div class="swatch-item" style="background: linear-gradient(145deg, #240a12, #0d0205);" onclick="setWallpaper('preset-rose', this)"></div>
                <div class="swatch-item" style="background-image: url('https://www.transparenttextures.com/patterns/stardust.png'); background-color: #0b0f19;" onclick="setWallpaper('preset-stars', this)"></div>
            </div>
            
            <input type="file" id="wallpaperGalleryPicker" accept="image/*" style="display: none;" onchange="handleWallpaperGalleryUpload(this)">
            <button class="gallery-wallpaper-btn" onclick="document.getElementById('wallpaperGalleryPicker').click()">🖼️ Choose from Device</button>
        </div>

        <div class="widgets-deck">
            <div class="widgets-row-top">
                <div class="countdown-widget" id="countdownBanner">❤️ Days: --</div>
                <div class="playlist-wrapper">
                    <span class="current-track-name" id="trackLabel">Loading...</span>
                    <button class="music-mini-control" id="musicBtn" onclick="toggleMusic()">🎵 Play</button>
                    <button class="music-mini-control" onclick="nextTrack()">⏭️ Next</button>
                </div>
            </div>
            
            <div class="mood-scroller-bar" id="moodBarDeck">
                <div class="mood-pill-item" onclick="updateMyMood('Normal 😊')">Normal 😊</div>
                <div class="mood-pill-item" onclick="updateMyMood('Miss You 🥺')">Miss You 🥺</div>
                <div class="mood-pill-item" onclick="updateMyMood('Happy 🥰')">Happy 🥰</div>
                <div class="mood-pill-item" onclick="updateMyMood('Busy 📝')">Busy 📝</div>
                <div class="mood-pill-item" onclick="updateMyMood('Need Hug 🫂')">Need Hug 🫂</div>
                <div class="mood-pill-item" onclick="updateMyMood('Angry 😤')">Angry 😤</div>
            </div>
        </div>

        <div class="chat-container">
            <div class="messages-display" id="notesSpace"></div>

            <div class="chat-input-area">
                <input type="file" id="mediaPicker" accept="image/*" style="display: none;" onchange="handleImageUpload(this)">
                <button class="attach-btn" onclick="document.getElementById('mediaPicker').click()">📎</button>
                
                <button class="mic-record-action-btn" id="voiceRecordBtn" onclick="handleVoiceNoteRecording()">🎙️</button>
                
                <textarea id="noteText" placeholder="Write a message..." oninput="handleTyping()"></textarea>
                <button class="send-btn" id="postBtn" onclick="saveNote()">➔</button>
            </div>
        </div>
    </div>

    <audio id="bgMusic" loop preload="auto" crossorigin="anonymous"></audio>

/* FIX: APPLIES WALLPAPER TO THE FULL #chatScreen ELEMENT */
function setWallpaper(styleKey, element) {
    const mainViewContainer = document.getElementById("chatScreen");
    mainViewContainer.style.backgroundImage = "none";
    
    if(styleKey === 'preset-dark') mainViewContainer.style.backgroundColor = "#0d080b";
    else if(styleKey === 'preset-purple') mainViewContainer.style.background = "linear-gradient(145deg, #150a21, #08030f)";
    else if(styleKey === 'preset-rose') mainViewContainer.style.background = "linear-gradient(145deg, #240a12, #0d0205)";
    else if(styleKey === 'preset-stars') {
        mainViewContainer.style.backgroundColor = "#0b0f19";
        mainViewContainer.style.backgroundImage = "url('https://www.transparenttextures.com/patterns/stardust.png')";
    }
    
    localStorage.setItem("chat_wallpaper_style", styleKey);
    if(element) {
        document.querySelectorAll('.swatch-item').forEach(s => s.classList.remove('selected'));
        element.classList.add('selected');
    }
}

function applyCustomBackgroundStyle(urlStr) {
    if(!urlStr.trim()) return;
    const mainViewContainer = document.getElementById("chatScreen");
    mainViewContainer.style.backgroundImage = `url('${urlStr}')`;
    mainViewContainer.style.backgroundSize = "cover";
    mainViewContainer.style.backgroundPosition = "center";
}

/* FIX: HANDLES DIRECT MOBILE GALLERY PICKER IMAGE UPLOADS FOR THE BACKGROUND THEME */
async function handleWallpaperGalleryUpload(inputInstance) {
    if (!inputInstance.files || inputInstance.files.length === 0) return;
    const file = inputInstance.files[0];
    
    const ext = file.name.split('.').pop();
    const uniqueFileName = `bg_${Date.now()}_${Math.random().toString(36).substring(5)}.${ext}`;

    const { data, error } = await dbClient.storage.from('chat-media').upload(uniqueFileName, file);
    if (error) {
        alert("Gallery theme upload processing failed. Double check your storage permissions.");
        return;
    }

    const { data: urlObj } = dbClient.storage.from('chat-media').getPublicUrl(uniqueFileName);
    
    applyCustomBackgroundStyle(urlObj.publicUrl);
    localStorage.setItem("chat_wallpaper_style", urlObj.publicUrl);
    
    document.querySelectorAll('.swatch-item').forEach(s => s.classList.remove('selected'));
    inputInstance.value = "";
}

async function handleVoiceNoteRecording() {
    const recBtn = document.getElementById("voiceRecordBtn");
    
    if (!isCurrentlyRecordingAudio) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            alert("Audio device input access is blocked or unsupported on this device viewport.");
            return;
        }
        
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorderInstance = new MediaRecorder(stream);
            recordedAudioChunks = [];
            
            mediaRecorderInstance.ondataavailable = (e) => {
                if (e.data.size > 0) recordedAudioChunks.push(e.data);
            };
            
            mediaRecorderInstance.onstop = async () => {
                const audioBlob = new Blob(recordedAudioChunks, { type: 'audio/mp3' });
                await uploadVoiceNoteToStorage(audioBlob);
                stream.getTracks().forEach(track => track.stop());
            };
            
            mediaRecorderInstance.start();
            isCurrentlyRecordingAudio = true;
            recBtn.classList.add("recording");
        } catch(err) {
            console.error("Mic layout initialization failed:", err);
        }
    } else {
        if(mediaRecorderInstance) mediaRecorderInstance.stop();
        isCurrentlyRecordingAudio = false;
        recBtn.classList.remove("recording");
    }
}

async function uploadVoiceNoteToStorage(blobFile) {
    const postBtn = document.getElementById("postBtn");
    postBtn.disabled = true;
    
    const uniqueFileName = `voice_${Date.now()}_${Math.random().toString(36).substring(5)}.mp3`;
    
    const { data, error } = await dbClient.storage.from('chat-media').upload(uniqueFileName, blobFile, {
        contentType: 'audio/mp3'
    });
    
    if (error) {
        alert("Audio recording file sync failed.");
        postBtn.disabled = false;
        return;
    }
    
    const { data: urlObj } = dbClient.storage.from('chat-media').getPublicUrl(uniqueFileName);
    await dbClient.from('messages').insert([{ author: myConfiguredName, text: `[VOICE_NOTE]:${urlObj.publicUrl}` }]);
    postBtn.disabled = false;
}

function inlineVoiceAudioPlay(audioUrl, elementId) {
    let activePlayer = window[`audio_player_${elementId}`];
    const fillBar = document.getElementById(`fill-${elementId}`);
    const triggerBtn = document.getElementById(`btn-${elementId}`);
    
    if (!activePlayer) {
        activePlayer = new Audio(audioUrl);
        window[`audio_player_${elementId}`] = activePlayer;
        
        activePlayer.ontimeupdate = () => {
            const pct = (activePlayer.currentTime / activePlayer.duration) * 100;
            if(fillBar) fillBar.style.width = `${pct}%`;
        };
        
        activePlayer.onended = () => {
            if(triggerBtn) triggerBtn.innerText = "▶";
            if(fillBar) fillBar.style.width = "0%";
        };
    }
    
    if (activePlayer.paused) {
        activePlayer.play();
        triggerBtn.innerText = "⏸";
    } else {
        activePlayer.pause();
        triggerBtn.innerText = "▶";
    }
}

async function handleBubbleDoubleTap(messageId, currentTag) {

    if (!bubbleElement) return;

    const newTag = currentTag === "loved" ? null : "loved";
    let heartEl = bubbleElement.querySelector('.bubble-heart-reaction');
    
    if (newTag === "loved") {
        if (!heartEl) {
            const tempHeart = document.createElement('span');
            tempHeart.className = 'bubble-heart-reaction';
            tempHeart.innerText = '❤️';

        }
    } else {
        if (heartEl) heartEl.remove();
    }

    await dbClient.from('messages').update({ tags: newTag }).eq('id', messageId);
}

async function fetchLastSeen() {
    if (document.getElementById("lockScreen").classList.contains("active")) return;
    const currentIdentity = document.getElementById("roleSelector").value;
    const targetRole = currentIdentity === "queen" ? "King" : "Queen";
    
    const { data, error } = await dbClient.from('user_status').select('last_active, mood').eq('username', targetRole).maybeSingle();
    
    if (data) {
        if (data.last_active) partnerLastActiveTimestamp = data.last_active;
        
        const moodBadge = document.getElementById("partnerMoodDisplay");
        if(data.mood && data.mood !== "Normal 😊") {
            moodBadge.innerText = data.mood;
            moodBadge.style.display = "inline-block";
        } else {
            moodBadge.style.display = "none";
        }
        renderCalculatedLastSeen();
    } else {
        document.getElementById("lastSeenDisplay").innerText = "last seen recently";
    }
}

function renderCalculatedLastSeen() {
    const displayEl = document.getElementById("lastSeenDisplay");
    if (!partnerLastActiveTimestamp || !displayEl) return;

    const dateObj = new Date(partnerLastActiveTimestamp);
    const today = new Date();
    const diffInSeconds = Math.floor((today - dateObj) / 1000);
    const normalizedSeconds = diffInSeconds < 0 ? 0 : diffInSeconds;

    if (normalizedSeconds < 60) {
        displayEl.innerText = "active now";
        return;
    } else if (normalizedSeconds < 3600) {
        const mins = Math.floor(normalizedSeconds / 60);
        displayEl.innerText = `last seen ${mins}m ago`;
        return;
    }

    let dayLabel = "today at ";
    if (dateObj.toDateString() !== today.toDateString()) {
        dayLabel = dateObj.toLocaleDateString([], {month:'short', day:'numeric'}) + " at ";
    }
    
    const timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
    displayEl.innerText = `last seen ${dayLabel}${timeStr}`;
}

function updatePresenceUI() {
    const statusBox = document.getElementById("liveStatusBox");
    const textEl = document.getElementById("liveStatusTxt");
    const seenEl = document.getElementById("lastSeenDisplay");
    let online = false, typing = false;

    Object.keys(collectivePresence).forEach(token => {
        if (token !== sessionToken) {
            const state = collectivePresence[token];
            if (state && state[0] && state[0].name.toLowerCase() === partnerConfiguredName.toLowerCase()) {
                online = true;
                if (state[0].typing) typing = true;
            }
        }
    });

    if (typing) {
        statusBox.className = "status-container typing";
        textEl.innerText = "typing...";
        seenEl.style.display = "none";
    } else if (online) {
        statusBox.className = "status-container online";
        textEl.innerText = "online";
        seenEl.style.display = "block";
        seenEl.innerText = "active now";
    } else {
        statusBox.className = "status-container offline";
        textEl.innerText = "offline";
        seenEl.style.display = "block";
        renderCalculatedLastSeen();
    }
}

function setupPresence() {
    if (presenceChannel) presenceChannel.unsubscribe();
    presenceChannel = dbClient.channel('presence-deck', { config: { presence: { key: sessionToken } } });
    presenceChannel
        .on('presence', { event: 'sync' }, () => {
            collectivePresence = presenceChannel.presenceState();
            updatePresenceUI();
        })
        .subscribe(async (status) => {
            if (status === 'SUBSCRIBED') {
                await presenceChannel.track({ name: myConfiguredName, typing: false });
                await logMyPresence();
                fetchLastSeen();
            }
        });
}

function initMessagesRealtime() {
    if (messagesRealtimeChannel) messagesRealtimeChannel.unsubscribe();
    
    messagesRealtimeChannel = dbClient
        .channel('schema-db-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => {
            loadNotes();
        })
        .subscribe();
}

function initStatusRealtime() {
    if (statusRealtimeChannel) statusRealtimeChannel.unsubscribe();
    
    const currentIdentity = document.getElementById("roleSelector").value;
    const targetRole = currentIdentity === "queen" ? "King" : "Queen";

    statusRealtimeChannel = dbClient
        .channel('status-db-changes')
        .on('postgres_changes', { 
            event: '*', 
            schema: 'public', 
            table: 'user_status',
            filter: `username=eq.${targetRole}`
        }, (payload) => {
            if (payload.new) {
                if(payload.new.last_active) partnerLastActiveTimestamp = payload.new.last_active;
                
                const moodBadge = document.getElementById("partnerMoodDisplay");
                if(payload.new.mood && payload.new.mood !== "Normal 😊") {
                    moodBadge.innerText = payload.new.mood;
                    moodBadge.style.display = "inline-block";
                } else {
                    moodBadge.style.display = "none";
                }
                updatePresenceUI();
            }
        })
        .subscribe();
}

async function loadNotes() {
    if (document.getElementById("lockScreen").classList.contains("active")) return;
    const space = document.getElementById("notesSpace");
    const { data, error } = await dbClient.from('messages').select('*').order('id', { ascending: true });
    if (error || !space) return;

    const scrollCheck = space.scrollHeight - space.scrollTop <= space.clientHeight + 200;
    space.innerHTML = "";
    let lastGroupDate = "";

    data.forEach(msg => {
        const dateObj = msg.created_at ? new Date(msg.created_at) : new Date();
        const groupDate = dateObj.toDateString();

        if (groupDate !== lastGroupDate) {
            space.innerHTML += `<div class="date-separator"><span class="date-badge">${dateObj.toLocaleDateString([], {month:'short', day:'numeric'})}</span></div>`;
            lastGroupDate = groupDate;
        }

        let msgAuthor = msg.author ? msg.author.trim() : "King";
        const isMe = msgAuthor.toLowerCase() === myConfiguredName.toLowerCase();
        const side = isMe ? "sent" : "received";
        const timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
        const heart = msg.tags === "loved" ? `<span class="bubble-heart-reaction">❤️</span>` : '';

        let content = `<span>${msg.text}</span>`;
        if (msg.text.startsWith("[VOICE_NOTE]:")) {
            const cleanAudioUrl = msg.text.replace("[VOICE_NOTE]:", "");
            content = `
                <div class="chat-voice-player">
                    <button class="voice-play-control-btn" id="btn-${msg.id}" onclick="inlineVoiceAudioPlay('${cleanAudioUrl}', '${msg.id}')">▶</button>
                    <div class="voice-timeline-bar">
                        <div class="voice-progress-fill" id="fill-${msg.id}"></div>
                    </div>
                </div>
            `;
        } else if (msg.text.match(/\.(jpeg|jpg|gif|png)/i) || msg.text.includes("/storage/v1/object/public/")) {
            content = `<img class="bubble-media-preview" src="${msg.text}" onclick="window.open('${msg.text}', '_blank')" />`;
        }

        space.innerHTML += `
            <div class="chat-row ${side}">
                <div class="chat-bubble" id="msg-${msg.id}">
                    <span class="sender-label">${msgAuthor}</span>
                    ${content}
                    <span class="timestamp">${timeStr}</span>
                    ${heart}
                </div>
            </div>
        `;
    });

    data.forEach(msg => {
        const el = document.getElementById(`msg-${msg.id}`);
        if (!el) return;
        
        let lastTap = 0;
        el.addEventListener('click', (e) => {
            if(e.target.tagName === 'IMG' || e.target.classList.contains('voice-play-control-btn')) return;
            const now = Date.now();
            if (now - lastTap < 300) handleBubbleDoubleTap(msg.id, msg.tags);
            lastTap = now;
        });

        let timer;
        el.addEventListener('touchstart', () => timer = setTimeout(() => deleteMsg(msg.id), 1000));
        el.addEventListener('touchend', () => clearTimeout(timer));
    });

    if (scrollCheck) space.scrollTop = space.scrollHeight;
}

async function saveNote() {

    input.value = "";
    await dbClient.from('messages').insert([{ author: myConfiguredName, text: txt }]);
    await logMyPresence();
}

async function deleteMsg(id) {

        await dbClient.from('messages').delete().eq('id', id);
    }
}

function calculateDays() {
    const startAnchor = new Date("2025-07-09T00:00:00");
    const today = new Date();
    const timeDiff = today.getTime() - startAnchor.getTime();
    const dayCount = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
    
    document.getElementById("homeCounterDisplay").innerText = `❤️ We have traveled ${dayCount} days together`;
    document.getElementById("countdownBanner").innerText = `❤️ ${dayCount} days`;
}

document.getElementById("noteText").addEventListener("keypress", (e) => { 
    if (e.key === "Enter" && !e.shiftKey) { 
        e.preventDefault(); 
        saveNote(); 
    } 
});

    if(modal.classList.contains("open") && !modal.contains(e.target) && e.target !== gearBtn && e.target !== galleryBtn) {
        modal.classList.remove("open");
    }
});

loadIdentity();
initAudioTrack();
calculateDays();

window.onload = () => {
    setInterval(updatePresenceUI, 4000);
    setInterval(fetchLastSeen, 5000);
    setInterval(logMyPresence, 10000); 
};
