<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Our Space</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#120018;
      color:white;
      min-height:100vh;
    }

    header{
      text-align:center;
      padding:25px;
      background:#1c1c1c;
      border-bottom:1px solid #333;
    }

    header h1{
      font-size:2rem;
    }

    .hero{
      text-align:center;
      padding:40px 20px;
    }

    .hero img{
      width:170px;
      height:170px;
      border-radius:50%;
      object-fit:cover;
      border:4px solid white;
      margin-bottom:20px;
    }

    .hero h2{
      margin-bottom:10px;
      font-size:1.8rem;
    }

    .hero p{
      color:#ccc;
      line-height:1.6;
    }

    .secret-box{
      background:#1f0a24;
      margin:20px;
      padding:20px;
      border-radius:15px;
    }

    input, textarea{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      font-size:1rem;
      background: white;
      color: black; 
    }

    textarea {
      height: 80px;
      resize: none;
    }

    button{
      width:100%;
      margin-top:15px;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#ff4d8d;
      color: white;       
      font-size:1rem;
      font-weight: bold;
      cursor: pointer; 
    }

    .hidden{
      display:none;
      margin-top:20px;
      background:#2a102f;
      padding:15px;
      border-radius:10px;
    }

    .board-container {
      margin-top: 25px;
      border-top: 1px solid #441a4d;
      padding-top: 20px;
    }

    .notes-display {
      background: #120018;
      max-height: 300px;
      overflow-y: auto;
      border-radius: 10px;
      padding: 10px;
      margin-top: 15px;
      border: 1px solid #441a4d;
    }

    .saved-note {
      background: #2a102f;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      border-left: 4px solid #ff4d8d;
    }

    .saved-note .author {
      font-weight: bold;
      color: #ff4d8d;
      font-size: 0.85rem;
      margin-bottom: 3px;
    }

    .saved-note .text {
      font-size: 0.95rem;
      word-wrap: break-word;
    }

    footer{
      text-align:center;
      padding:20px;
      color:#ccc;
      font-style: italic;
    }
  </style>
</head>

<body>

  <header>
    <h1>𝐕🤍𝐑</h1>
  </header>

  <section class="hero">
    <img src="https://i.ibb.co/x8mH6Vj8/Screenshot-20260525-225554.jpg" />
    <h2>𝐌𝐞 𝐕 𝐚𝐧𝐝 𝐌𝐲 𝐐𝐮𝐞𝐞𝐧 𝐑</h2>
    <p>
      Welcome to our private website.
      For my love. Who is close to my heart my wife. My pondati 🤍
    </p>
  </section>

  <section class="secret-box">
    <h3>Friends Access</h3>
    <input type="password" id="password" placeholder="Enter Password">
    <button id="enterBtn" onclick="checkPassword()">Enter</button>

    <audio id="bgMusic" loop>
      <source src="https://files.catbox.moe/xryip4.mp3" type="audio/mpeg">
    </audio>

    <div class="hidden" id="secretContent">
      <h3>Private Area</h3>
      <br>
      <p>𝓦𝓮𝓵𝓬𝓸𝓶𝓮 𝓽𝓸 𝓸𝓾𝓻 𝓭𝓻𝓮𝓪𝓶 𝓡𝓸𝓶𝓪𝓷𝓽𝓲𝐜 𝓪𝓷𝓭 𝓯𝓪𝓷𝓽𝓪𝓼𝔂 𝓦𝓸𝓻𝓵𝓭.</p>

      <div class="board-container">
        <h3 style="color: #ff4d8d;">Our Message Board</h3>
        
        <input type="text" id="noteAuthor" placeholder="Your Name">
        <textarea id="noteText" placeholder="Write a message for us..."></textarea>
        <button id="postBtn" onclick="saveNote()">Post Message</button>

        <div class="notes-display" id="notesSpace">
          <p style="color:#777; font-size:0.9rem; text-align:center;">Loading messages...</p>
        </div>
      </div>
    </div>
  </section>

  <footer>
    Made for us our secret thing. For my Queen and Me..... 🤍
  </footer>

  <script>
const SUPABASE_URL = "https://qawwshkvflbfvguboarm.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFhd3dzaGt2ZmxiZnZndWJvYXJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MTY2ODgsImV4cCI6MjA5NTM5MjY4OH0.qXy5KdAcW4AyIKR9eLWdXdLfhGFEKyDYaML9k0AFL2M";
const dbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function checkPassword(){
    const password = document.getElementById("password").value;
    if(password === "visha27112011"){
        document.getElementById("secretContent").style.display = "block";
        await loadNotes();
        setInterval(loadNotes, 7000);
        
        const music = document.getElementById("bgMusic");
        if(music) music.play().catch(e => console.log("Audio placement complete."));
    } else {
        alert("Wrong Password");
    }
}

    async function saveNote() {
      const authorInput = document.getElementById("noteAuthor");
      const textInput = document.getElementById("noteText");
      const postBtn = document.getElementById("postBtn");
      
      const author = authorInput.value.trim() || "Anonymous";
      const text = textInput.value.trim();

      if(text !== "") {
        postBtn.disabled = true;
        postBtn.innerText = "Sending...";

        const { error } = await dbClient 
        .from('messages')
        .insert([{ author: author, text: text }]);

                if (error) {
            alert("Error saving message: " + (error?.message || JSON.stringify(error)));
        } else {
            authorInput.value = "";
            textInput.value = "";
            await loadNotes();
        }

        postBtn.disabled = false;
        postBtn.innerText = "Post Message";
    }  
}

    async function loadNotes() {
      const notesSpace = document.getElementById("notesSpace");
      
      const { data: notes, error } = await dbClient
        .from('messages')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        return; 
      }

      notesSpace.innerHTML = "";
      
      if(!notes || notes.length === 0) {
        notesSpace.innerHTML = '<p style="color:#777; font-size:0.9rem; text-align:center;">No messages left yet. Be the first!</p>';
        return;
      }

      notes.forEach(note => {
        const div = document.createElement("div");
        div.classList.add("saved-note");
        div.innerHTML = `
          <div class="author">${escapeHTML(note.author)}</div>
          <div class="text">${escapeHTML(note.text)}</div>
        `;
        notesSpace.appendChild(div);
      });
    }

    function escapeHTML(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");  
    }
  </script>
</body>
</html>
